# Fahrgrenzen des Omnibot 5402, abgeleitet aus der Messreihe vom 15.08.2026.
#
# Das hier ist **keine** vollstaendige Nav2-Konfiguration, sondern die Sammlung
# der Zahlen, die aus der Kennlinie folgen. Sie werden in die spaetere
# nav2_params.yaml uebernommen. So steht an einer Stelle, warum jeder Wert so
# gewaehlt ist - Herleitung in DOCUMENTATION.md.
#
#   Kennlinie:   v = 2,49e-4 * (duty - 140)
#   gemessen:    0,212 m/s bei duty 1000, 2,48 rad/s Drehrate
#   Spurweite:   0,170 m (effektiv gemessen ~0,165 m)

controller_server:
  ros__parameters:
    FollowPath:
      # Hoechstgeschwindigkeit ist 0,212 m/s. 0,20 laesst Luft, damit der
      # Regler nicht dauernd in die Begrenzung faehrt.
      max_vel_x: 0.20
      min_vel_x: 0.0
      max_vel_theta: 1.2

      # Untergrenze der gueltigen Kennlinie. Darunter kriecht der Roboter und
      # das lineare Modell stimmt nicht mehr - der Motorknoten zieht solche
      # Sollwerte auf duty 400 hoch, faehrt dann also schneller als bestellt.
      min_speed_xy: 0.065
      max_speed_xy: 0.20
      min_speed_theta: 0.0

      # Rueckwaertsfahrt ist gemessen symmetrisch, aber der LIDAR sieht nach
      # hinten genauso wenig wie nach vorn unter 0,40 m. Vorerst kein
      # Rueckwaertsfahren in der Planung.
      max_vel_x_backwards: 0.0

velocity_smoother:
  ros__parameters:
    max_velocity: [0.20, 0.0, 1.2]
    min_velocity: [-0.20, 0.0, -1.2]

local_costmap:
  local_costmap:
    ros__parameters:
      # Ursprung liegt weit hinten, siehe DOCUMENTATION.md - deshalb Polygon
      # und kein Kreis, das spart rund 5 cm sinnlose Aufblaehung.
      footprint: "[[0.2025, 0.125], [0.2025, -0.125], [-0.0875, -0.125], [-0.0875, 0.125]]"
      obstacle_layer:
        scan:
          # Die im Treiber angegebenen 25 m sind unrealistisch und erzeugen nur
          # Rauschen in der Costmap.
          raytrace_max_range: 8.0
          obstacle_max_range: 6.0

global_costmap:
  global_costmap:
    ros__parameters:
      footprint: "[[0.2025, 0.125], [0.2025, -0.125], [-0.0875, -0.125], [-0.0875, 0.125]]"
